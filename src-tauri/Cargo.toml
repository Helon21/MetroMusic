[package]
name = "metromusic"
version = "0.1.0"
description = "Player de música desktop, offline e online"
edition = "2021"

[lib]
name = "metromusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
souvlaki = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Backend de áudio e provedores
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
futures-util = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["aac", "mp3", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "alac"] }
cpal = "0.15"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
md-5 = "0.10"
unicode-normalization = "0.1"
urlencoding = "2"
roxmltree = "0.20"
